<div class="burgermenu-content">
  <div class="menu-header">
    <p class="menu-title">
      {{ 'navigation.menu' | translate }}
    </p>

    <button
      #closeButton
      class="close-button"
      type="button"
      (click)="close()"
      [attr.aria-label]="'accessibility.closeNavigation' | translate"
    >
      <img class="close-default" src="icons/close_green.svg" alt="" aria-hidden="true" />
      <img class="close-hover" src="icons/close_pink.svg" alt="" aria-hidden="true" />
    </button>
  </div>

  <nav id="mobile-navigation" [attr.aria-label]="'accessibility.mainNavigation' | translate">
    <div class="page-nav-links">
      <a class="nav-links" href="#about" (click)="close()">
        <img class="menu-icon" src="icons/star_pink_small.svg" alt="" aria-hidden="true" />
        <span>{{ 'navigation.about' | translate }}</span>
      </a>

      <a class="nav-links" href="#skills" (click)="close(false)">
        <img class="menu-icon" src="icons/star_pink_small.svg" alt="" aria-hidden="true" />
        <span>{{ 'navigation.skills' | translate }}</span>
      </a>

      <a class="nav-links" href="#projects" (click)="close(false)">
        <img class="menu-icon" src="icons/star_pink_small.svg" alt="" aria-hidden="true" />
        <span>{{ 'navigation.projects' | translate }}</span>
      </a>

      <a class="nav-links" href="#references" (click)="close(false)">
        <img class="menu-icon" src="icons/star_pink_small.svg" alt="" aria-hidden="true" />
        <span>{{ 'navigation.references' | translate }}</span>
      </a>

      <a class="nav-links" href="#contact" (click)="close(false)">
        <img class="menu-icon" src="icons/star_pink_small.svg" alt="" aria-hidden="true" />
        <span>{{ 'navigation.contact' | translate }}</span>
      </a>
    </div>
  </nav>

  <nav class="mobile-social-links" [attr.aria-label]="'accessibility.socialNavigation' | translate">
    <a
      href="https://github.com/NadineJuliana"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="GitHub"
    >
      <img src="icons/github_black.svg" alt="" aria-hidden="true" />
    </a>

    <a
      href="https://www.linkedin.com/in/nadine-bauer-1615123b6/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="LinkedIn"
    >
      <img src="icons/linkedin_black.svg" alt="" aria-hidden="true" />
    </a>

    <a href="#contact" (click)="close(false)" [attr.aria-label]="'navigation.contact' | translate">
      <img src="icons/email_black.svg" alt="" aria-hidden="true" />
    </a>
  </nav>
</div>
