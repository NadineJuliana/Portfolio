<div class="contact-content">
  <div class="contact-wrapper">
    <div class="contact-header">
      <h2>{{ 'contact.title' | translate }}</h2>
      <h4>{{ 'contact.subtitle' | translate }}</h4>
      <article>
        {{ 'contact.text' | translate }}
      </article>
    </div>
    <div class="contactform">
      <app-contact-form></app-contact-form>
    </div>
  </div>
  <div class="animation-content">
    <div class="animation-wrapper">
      <img class="pink-star" src="icons/star_pink_big.svg" alt="Star Icon" />
      <img class="green-star" src="icons/star_darkgreen_big.svg" alt="Star Icon" />
    </div>
  </div>
  <app-footer></app-footer>
</div>
