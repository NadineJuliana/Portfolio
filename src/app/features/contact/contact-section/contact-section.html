<div class="contact-content">
  <div class="contact-wrapper">
    <div class="contact-header">
      <h2>{{ 'contact.title' | translate }}</h2>

      <h3 class="contact-subtitle">
        {{ 'contact.subtitle' | translate }}
      </h3>

      <p class="contact-description">
        {{ 'contact.text' | translate }}
      </p>
    </div>

    <div class="contactform">
      <app-contact-form></app-contact-form>
    </div>
  </div>

  <div class="contact-bottom">
    <a class="scroll-top" href="#hero" [attr.aria-label]="'accessibility.backToTop' | translate">
      <img class="arrow arrow-default" src="icons/arrow_white.svg" alt="" />
      <img class="arrow arrow-hover" src="icons/arrow_pink.svg" alt="" />
    </a>

    <app-footer></app-footer>

    <div class="animation-content" aria-hidden="true">
      <div class="animation-wrapper">
        <img class="pink-star" src="icons/star_pink_big.svg" alt="" />
        <img class="green-star" src="icons/star_darkgreen_big.svg" alt="" />
      </div>
    </div>
  </div>
</div>
