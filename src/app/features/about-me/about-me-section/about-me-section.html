<div class="about-me-content">
  <div class="profile-image">
    <img src="img/Screenshot_20260428_143624.jpg" alt="Profile Image" />
  </div>
  <div class="headline">
    <h2>{{ 'about.title' | translate }}</h2>
  </div>

  <div class="about-me-description">
    <article>
      <p>{{ 'about.greeting' | translate }}</p>

      <p>{{ 'about.paragraph1' | translate }}</p>

      <p>{{ 'about.paragraph2' | translate }}</p>
    </article>
    <div class="description-footer">
      <a href="#contact">
        <button class="btn-primary">{{ 'about.button' | translate }}</button>
      </a>
      <img
        class="bounce"
        src="icons/emoji.svg"
        alt="Emoji Icon"
        (mouseenter)="showMore = true"
        (mouseleave)="showMore = false"
      />
    </div>
  </div>
  <div class="about-me-overlay" [class.visible]="showMore">
    <h4>{{ 'about.overlayTitle' | translate }}</h4>
    <ul>
      @for (fact of 'about.facts' | translate; track fact) {
        <li>
          <img src="icons/check_circle.svg" alt="Check Circle" />
          {{ fact }}
        </li>
      }
    </ul>
  </div>
</div>
