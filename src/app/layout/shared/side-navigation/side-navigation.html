<nav class="side-nav" [attr.aria-label]="'accessibility.sectionNavigation' | translate">
  @for (section of sections; track section) {
    <a
      class="bullet-btn"
      [href]="'#' + section"
      [attr.aria-label]="('navigation.' + section) | translate"
      [attr.aria-current]="activeSection() === section ? 'location' : null"
    >
      <img [src]="getImage(section)" alt="" aria-hidden="true" />
    </a>
  }
</nav>
